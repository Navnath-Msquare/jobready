<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobReady | Auth</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='textGrad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%232563eb' /%3E%3Cstop offset='100%25' stop-color='%230ea5e9' /%3E%3C/linearGradient%3E%3C/defs%3E%3Cpath d='M 15 50 A 35 35 0 0 0 85 50' fill='none' stroke='%233b82f6' stroke-width='8' transform='rotate(-25 50 50)' /%3E%3Cpath d='M 15 50 A 35 35 0 0 1 85 50' fill='none' stroke='%23ef4444' stroke-width='8' transform='rotate(-25 50 50)' /%3E%3Ctext x='48' y='68' font-family='Arial Black, sans-serif' font-size='50' font-weight='900' font-style='italic' text-anchor='middle' fill='url(%23textGrad)'%3EJR%3C/text%3E%3C/svg%3E">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f8fafc;
            font-family: 'Inter', sans-serif;
            position: relative;
            overflow-x: hidden;
        }
        /* Animated Mesh Background Orbs */
        .animated-mesh-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1;
            overflow: hidden;
            background: #f1f5f9;
        }
        .mesh-orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.5;
            animation: orbFloat 20s infinite alternate;
        }
        .mesh-orb-1 {
            width: 400px; height: 400px;
            background: #3b82f6;
            top: -100px; left: -100px;
        }
        .mesh-orb-2 {
            width: 500px; height: 500px;
            background: #ec4899;
            bottom: -200px; right: -100px;
            animation-delay: -5s;
        }
        @keyframes orbFloat {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }
        
        .standalone-auth-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.4);
            border-radius: 24px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
            width: 100%;
            max-width: 650px;
            margin: 40px 20px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .sac-header {
            padding: 30px 40px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #e2e8f0;
        }
        .sac-body {
            padding: 40px;
        }
    
        *, *::before, *::after { box-sizing: border-box !important; }
        .sac-body {
            padding: 50px !important;
        }
        .asp-input-row input, .asp-input-row select {
            box-sizing: border-box !important;
            width: 100% !important;
        }
        .asp-submit-btn {
            margin-top: 40px !important;
            margin-bottom: 20px !important;
        }
        .asp-field-grid {
            gap: 25px !important;
        }
    
        /* Bulletproof Form Fixes */
        .asp-form-title h2 { font-size: 26px !important; font-weight: 800 !important; color: #0f172a !important; text-align: center !important; margin: 0 0 10px 0 !important; text-shadow: none !important; }
        .asp-form-title p { font-size: 14px !important; color: #64748b !important; text-align: center !important; text-shadow: none !important; margin: 0 0 30px 0 !important; }
        
        .asp-field label { display: block !important; font-size: 13px !important; font-weight: 700 !important; color: #334155 !important; margin-bottom: 8px !important; text-shadow: none !important; text-align: left !important; }
        
        .asp-input-row input, .asp-input-row select {
            width: 100% !important;
            padding: 14px 16px !important;
            font-size: 15px !important;
            font-family: 'Inter', sans-serif !important;
            color: #1e293b !important;
            background-color: #f8fafc !important;
            border: 1px solid #cbd5e1 !important;
            border-radius: 10px !important;
            box-sizing: border-box !important;
            transition: all 0.25s ease !important;
        }
        .asp-input-row input:focus, .asp-input-row select:focus {
            outline: none !important;
            background-color: #ffffff !important;
            border-color: #3b82f6 !important;
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15) !important;
        }
        
        .asp-submit-btn {
            width: 100% !important;
            padding: 16px !important;
            background: linear-gradient(135deg, #2563eb, #3b82f6) !important;
            color: white !important;
            font-size: 16px !important;
            font-weight: 700 !important;
            border: none !important;
            border-radius: 10px !important;
            cursor: pointer !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 10px !important;
            margin-top: 30px !important;
            margin-bottom: 10px !important;
        }
</style>

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
</head>
<body>
    <div class="animated-mesh-bg">
        <div class="mesh-orb mesh-orb-1"></div>
        <div class="mesh-orb mesh-orb-2"></div>
    </div>

    <div class="standalone-auth-card">
        <div class="sac-header">
            <a href="index.html" style="text-decoration:none;">
                <div class="asp-header-logo">
                    <div class="jr-orbit-logo">
                        <div class="jr-orbit-ring red-ring"></div>
                        <div class="jr-orbit-ring blue-ring"></div>
                        <div class="jr-orbit-text">JR</div>
                    </div>
                    <div>
                        <h3>JobReady</h3>
                        <p>Student to Hired</p>
                    </div>
                </div>
            </a>
        </div>
        <div class="sac-body">
            <div class="asp-form-title">
                <h2>Create Account</h2>
                <p>Join JobReady — your career journey starts here.</p>
            </div>
            
            <form id="registerForm" onsubmit="handleRegister(event)">
                <div class="asp-field-grid">
                    <div class="asp-field">
                        <label>Full Name *</label>
                        <div class="asp-input-row">
                            <input type="text" id="regName" placeholder="Your full name" required>
                        </div>
                    </div>
                    <div class="asp-field">
                        <label>Email Address *</label>
                        <div class="asp-input-row">
                            <input type="email" id="regEmail" placeholder="your@email.com" required>
                        </div>
                    </div>
                    
                    <div class="asp-field">
                        <label>Age *</label>
                        <div class="asp-input-row">
                            <input type="number" id="regAge" placeholder="e.g. 21" min="16" max="99" required>
                        </div>
                    </div>
                    <div class="asp-field">
                        <label>City *</label>
                        <div class="asp-input-row">
                            <input type="text" id="regCity" placeholder="e.g. Pune" required>
                        </div>
                    </div>

                    <div class="asp-field">
                        <label>Phone Number</label>
                        <div class="asp-input-row">
                            <input type="tel" id="regPhone" placeholder="9876543210">
                        </div>
                    </div>
                    <div class="asp-field">
                        <label>Target Role *</label>
                        <div class="asp-input-row">
                            <select id="regRole" required>
                                <option value="" disabled selected>Select Role...</option>
                                <option value="Frontend Developer">Frontend Developer</option>
                                <option value="Backend Developer">Backend Developer</option>
                                <option value="Full Stack Developer">Full Stack Developer</option>
                                <option value="Data Analyst">Data Analyst</option>
                                <option value="UI/UX Designer">UI/UX Designer</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="asp-field asp-field-full">
                        <label>Education / College</label>
                        <div class="asp-input-row">
                            <input type="text" id="regCollege" placeholder="B.Tech / BE Computer Science">
                        </div>
                    </div>

                    <div class="asp-field asp-field-full">
                        <div class="asp-auto-pwd-box">
                            <div class="asp-auto-pwd-head">
                                <span>Login Password</span>
                                <span class="asp-auto-tag">Auto-Generated</span>
                            </div>
                            <p>Leave empty for auto-generated secure password sent to email, or type custom.</p>
                            <div class="asp-input-row">
                                <input type="password" id="regPassword" placeholder="Leave empty = auto-generate">
                            </div>
                        </div>
                    </div>
                </div>

                <button type="submit" class="asp-submit-btn">
                    <span>Register & Send Emails</span>
                    <span>&rarr;</span>
                </button>
            </form>
            
            <p class="asp-switch-hint">Already registered? <a href="login.html" style="color:#2563eb;font-weight:700;">Login here &rarr;</a></p>
        </div>
    </div>
    
    <script src="jobready-auth.js"></script>

<!-- Global Back Button -->
<button onclick="history.back()" class="global-back-btn">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back
</button>
</body>
</html>
