if (skills.length === 0) {

            </a>

        </div>
    `;

} else {

    let html = "";

    /*
       Show ALL available roadmaps
    */

    Object.keys(roadmapData).forEach((skill, index) => {

        const data = roadmapData[skill];

        html += `

            <div class="roadmap-card">

                <div class="roadmap-number">
                    ${index + 1}
                </div>

                        </span>
                    </div>


                    <div class="roadmap-progress">

                        <div class="progress-bar">

                            <div
                                class="progress-fill"
                                id="progress-${index}">
                            </div>

                        </div>

                        <span id="progress-text-${index}">
                            0% Complete
                        </span>

                    </div>


                    <ul class="roadmap-steps">

                        ${data.steps.map((step, stepIndex) => `

                            <li>

                                <label>

                                    <input
                                        type="checkbox"
                                        class="roadmap-check"
                                        data-skill="${skill}"
                                        data-step="${stepIndex}"
                                        onchange="updateProgress('${skill}', ${index})"
                                    >

                                    <span>
                                        ${step}
                                    </span>

                                </label>

                            </li>

                        `).join("")}

                    </ul>

                </div>

            </div>

        `;

    });


    roadmapContainer.innerHTML = html;


    /*
       Load saved progress
    */

    loadProgress();

}


/* =========================================
   UPDATE PROGRESS
========================================= */

function updateProgress(skill, cardIndex) {

    const checkboxes = document.querySelectorAll(
        `.roadmap-check[data-skill="${skill}"]`
    );


    let completed = 0;


    checkboxes.forEach((checkbox, index) => {

        if (checkbox.checked) {
            completed++;
        }


        localStorage.setItem(
            `roadmap-${skill}-${index}`,
            checkbox.checked
        );

    });


    const total = checkboxes.length;


    const percentage = total === 0
        ? 0
        : Math.round((completed / total) * 100);


    const progress =
        document.getElementById(`progress-${cardIndex}`);


    const progressText =
        document.getElementById(`progress-text-${cardIndex}`);


    if (progress) {
        progress.style.width = percentage + "%";
    }


    if (progressText) {
        progressText.textContent =
            percentage + "% Complete";
    }

}


/* =========================================
   LOAD SAVED PROGRESS
========================================= */

function loadProgress() {

    document.querySelectorAll(".roadmap-check")
        .forEach(checkbox => {

            const skill = checkbox.dataset.skill;
            const step = checkbox.dataset.step;


            const saved = localStorage.getItem(
                `roadmap-${skill}-${step}`
            );


            checkbox.checked = saved === "true";

        });


    Object.keys(roadmapData).forEach((skill, index) => {

        const checkbox =
            document.querySelector(
                `.roadmap-check[data-skill="${skill}"]`
            );


        if (checkbox) {

            updateProgress(skill, index);

        }

    });

}
