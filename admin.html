<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Job Ready</title>
    
    <!-- Libraries for Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --primary-dark: #0284c7;
            --secondary: #10b981;
            --dark: #0f172a;
            --light: #f8fafc;
            --gray: #64748b;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Outfit', sans-serif; }
        
        body {
            background: #f1f5f9;
            color: var(--dark);
            min-height: 100vh;
        }

        /* Navbar */
        .admin-nav {
            background: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .jr-logo-text {
            font-size: 24px;
            font-weight: 900;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .jr-logo-text span { color: #0ea5e9; }
        .admin-badge {
            background: #ef4444;
            color: white;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 20px;
            margin-left: 10px;
        }

        .logout-btn {
            background: transparent;
            border: 2px solid #ef4444;
            color: #ef4444;
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }
        .logout-btn:hover {
            background: #ef4444;
            color: white;
        }

        /* Main Content */
        .admin-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .page-header h1 { font-size: 32px; font-weight: 800; }

        .export-actions {
            display: flex;
            gap: 15px;
        }
        .export-btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            color: white;
            transition: 0.3s;
        }
        .btn-pdf { background: #ef4444; }
        .btn-pdf:hover { background: #dc2626; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4); }
        .btn-excel { background: #10b981; }
        .btn-excel:hover { background: #059669; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4); }

        /* Table Card */
        .table-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            overflow: hidden;
        }

        /* Printable Area (for PDF) */
        #printableArea {
            padding: 20px;
        }

        .print-header {
            display: none; /* Only show in PDF */
            text-align: center;
            margin-bottom: 20px;
        }
        .print-header h2 {
            color: #0ea5e9;
            font-size: 28px;
            margin-bottom: 5px;
        }
        .print-header p {
            color: #64748b;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }
        th {
            background: #f8fafc;
            padding: 15px 20px;
            text-align: left;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 15px 20px;
            border-bottom: 1px solid #e2e8f0;
            font-size: 15px;
            vertical-align: middle;
        }
        tr:hover { background: #f8fafc; }

        .role-badge {
            background: #e0f2fe;
            color: #0284c7;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 600;
        }

        .action-btns {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            width: 32px;
            height: 32px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.3s;
        }
        .edit-btn { color: #3b82f6; background: #eff6ff; }
        .edit-btn:hover { background: #3b82f6; color: white; }
        .delete-btn { color: #ef4444; background: #fef2f2; }
        .delete-btn:hover { background: #ef4444; color: white; }

        /* Modal */
        .admin-modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s;
            z-index: 1000;
        }
        .admin-modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .admin-modal {
            background: white;
            width: 90%;
            max-width: 500px;
            border-radius: 16px;
            padding: 30px;
            transform: translateY(20px);
            transition: 0.3s;
        }
        .admin-modal-overlay.active .admin-modal {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h3 { font-size: 22px; }
        .close-modal {
            background: none; border: none; font-size: 24px; cursor: pointer; color: #64748b;
        }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px;
            font-size: 15px; font-family: 'Outfit'; outline: none;
        }
        .form-group input:focus { border-color: #0ea5e9; }
        .save-btn {
            width: 100%; background: #0ea5e9; color: white; padding: 12px; border: none;
            border-radius: 8px; font-weight: bold; font-size: 16px; cursor: pointer; margin-top: 10px;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="admin-nav">
        <div class="jr-logo-text">
            Job<span>Ready</span> <span class="admin-badge">ADMIN</span>
        </div>
        <button class="logout-btn" onclick="logoutAdmin()">Logout</button>
    </nav>

    <!-- Content -->
    <div class="admin-container">
        <div class="page-header">
            <h1>Registered Users</h1>
            <div class="export-actions">
                <button class="export-btn btn-excel" onclick="exportToExcel()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
                    Download Excel
                </button>
                <button class="export-btn btn-pdf" onclick="exportToPDF()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                    Download PDF
                </button>
            </div>
        </div>

        <div class="table-card">
            <!-- This area is printed in PDF -->
            <div id="printableArea">
                <div class="print-header" id="printHeader">
                    <h2>JobReady</h2>
                    <p>Registered Users Report | Generated on <span id="reportDate"></span></p>
                </div>
                
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email & Phone</th>
                            <th>Target Role</th>
                            <th>Password</th>
                            <th class="no-print">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- Dynamic Content -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Edit User Modal -->
    <div class="admin-modal-overlay" id="editModalOverlay">
        <div class="admin-modal">
            <div class="modal-header">
                <h3>Edit User</h3>
                <button class="close-modal" onclick="closeEditModal()">&times;</button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="editUserId">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="editName">
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" id="editEmail">
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="text" id="editPhone">
                </div>
                <div class="form-group">
                    <label>Target Role</label>
                    <input type="text" id="editRole">
                </div>
                <button class="save-btn" onclick="saveUserEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
